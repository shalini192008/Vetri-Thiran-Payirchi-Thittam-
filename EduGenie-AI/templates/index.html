<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>EduGenie - AI Learning Assistant</title>

<link rel="stylesheet" href="/static/style.css">
```

</head>

<body>

```
<div class="container">

    <h1>🎓 EduGenie</h1>

    <p class="subtitle">
        Google Gemini Powered Learning Assistant
    </p>

    <div class="card">

        <label for="task">Choose a task</label>

        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Topic
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize
            </option>

            <option value="learn">
                Learning Path
            </option>

        </select>


        <label for="inputText">
            Enter your question or topic
        </label>

        <textarea
            id="inputText"
            placeholder="Example: Explain photosynthesis..."
        ></textarea>


        <button onclick="runEduGenie()">
            🚀 Ask EduGenie
        </button>


        <div id="loading" style="display:none;">
            EduGenie is thinking...
        </div>


        <div id="result"></div>

    </div>

</div>


<script>

    async function runEduGenie() {

        const task = document.getElementById("task").value;

        const input =
            document.getElementById("inputText").value;

        const result =
            document.getElementById("result");

        const loading =
            document.getElementById("loading");


        if (!input.trim()) {

            result.innerHTML =
                "<p>Please enter something first.</p>";

            return;
        }


        loading.style.display = "block";

        result.innerHTML = "";


        let endpoint = "";

        let fieldName = "";


        if (task === "qa") {

            endpoint = "/qa";

            fieldName = "question";

        }

        else if (task === "explain") {

            endpoint = "/explain";

            fieldName = "topic";

        }

        else if (task === "quiz") {

            endpoint = "/quiz";

            fieldName = "topic";

        }

        else if (task === "summarize") {

            endpoint = "/summarize";

            fieldName = "text";

        }

        else if (task === "learn") {

            endpoint = "/learn/recommendations";

            fieldName = "topic";

        }


        const formData = new FormData();

        formData.append(fieldName, input);


        try {

            const response = await fetch(
                endpoint,
                {
                    method: "POST",
                    body: formData
                }
            );


            const data = await response.json();


            if (task === "quiz" && Array.isArray(data.result)) {

                let html = "<h2>Quiz</h2>";


                data.result.forEach((q, index) => {

                    html += `
                        <div class="quiz-question">

                            <h3>
                                ${index + 1}. ${q.question}
                            </h3>

                            <ul>

                                ${q.options.map(option =>
                                    `<li>${option}</li>`
                                ).join("")}

                            </ul>

                            <p>
                                <strong>Answer:</strong>
                                ${q.answer}
                            </p>

                        </div>
                    `;

                });


                result.innerHTML = html;

            }

            else {

                result.innerHTML =
                    `<div class="answer">
                        ${formatText(data.result)}
                    </div>`;

            }

        }

        catch (error) {

            result.innerHTML =
                `<p class="error">
                    Something went wrong. Please try again.
                </p>`;

        }


        loading.style.display = "none";

    }


    function formatText(text) {

        if (!text) return "";

        return text
            .replace(/\n/g, "<br>")
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    }

</script>
```
